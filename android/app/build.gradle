apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

/**
 * React Native configuration
 */
react {
    entryFile = file([
        "node",
        "-e",
        "require('expo/scripts/resolveAppEntry')",
        projectRoot,
        "android",
        "absolute"
    ].execute(null, rootDir).text.trim())

    reactNativeDir = new File([
        "node",
        "--print",
        "require.resolve('react-native/package.json')"
    ].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    hermesCommand = new File([
        "node",
        "--print",
        "require.resolve('hermes-compiler/package.json', { paths: [require.resolve('react-native/package.json')] })"
    ].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() +
        "/hermesc/%OS-BIN%/hermesc"

    codegenDir = new File([
        "node",
        "--print",
        "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"
    ].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (
        findProperty('android.enableBundleCompression') ?: false
    ).toBoolean()

    cliFile = new File([
        "node",
        "--print",
        "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"
    ].execute(null, rootDir).text.trim())

    bundleCommand = "export:embed"

    autolinkLibrariesWithApp()
}

/**
 * Release build optimization
 */
def enableMinifyInReleaseBuilds = (
    findProperty('android.enableMinifyInReleaseBuilds') ?: true
).toBoolean()

/**
 * JavaScriptCore
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    externalNativeBuild {
        cmake {
            buildStagingDirectory "C:/cxx"
        }
    }
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.anonymous.FinX'

    defaultConfig {
        applicationId 'com.anonymous.FinX'

        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        versionCode 1
        versionName "1.0.0"

        buildConfigField(
            "String",
            "REACT_NATIVE_RELEASE_LEVEL",
            "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
        )
    }

    /**
     * Signing configurations
     */
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
    }

    /**
     * Build types
     */
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            /**
             * Use the release keystore.
             */
            signingConfig signingConfigs.release

            /**
             * R8 / ProGuard
             *
             * Removes unused Java/Kotlin code and optimizes
             * the Android application.
             */
            minifyEnabled enableMinifyInReleaseBuilds

            /**
             * Remove unused Android resources.
             */
            def enableShrinkResources = (
                findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: true
            ).toString()

            shrinkResources enableShrinkResources.toBoolean()

            /**
             * ProGuard / R8 configuration.
             */
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )

            /**
             * PNG optimization.
             */
            def enablePngCrunchInRelease = (
                findProperty('android.enablePngCrunchInReleaseBuilds') ?: true
            ).toString()

            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }

    /**
     * APK packaging
     */
    packagingOptions {
        jniLibs {
            def enableLegacyPackaging = (
                findProperty('expo.useLegacyPackaging') ?: 'false'
            )

            useLegacyPackaging enableLegacyPackaging.toBoolean()
        }
    }

    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

/**
 * Apply static values from gradle.properties
 * to android.packagingOptions.
 */
[
    "pickFirsts",
    "excludes",
    "merges",
    "doNotStrip"
].each { prop ->

    def options = (
        findProperty("android.packagingOptions.$prop") ?: ""
    ).split(",")

    for (i in 0..<options.size()) {
        options[i] = options[i].trim()
    }

    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"

        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

/**
 * Dependencies
 */
dependencies {
    implementation("com.facebook.react:react-android")

    def isGifEnabled = (
        findProperty('expo.gif.enabled') ?: ""
    ) == "true"

    def isWebpEnabled = (
        findProperty('expo.webp.enabled') ?: ""
    ) == "true"

    def isWebpAnimatedEnabled = (
        findProperty('expo.webp.animated') ?: ""
    ) == "true"

    if (isGifEnabled) {
        implementation(
            "com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}"
        )
    }

    if (isWebpEnabled) {
        implementation(
            "com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}"
        )

        if (isWebpAnimatedEnabled) {
            implementation(
                "com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}"
            )
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}